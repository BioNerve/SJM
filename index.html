<title>Timer</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
  /* Layout: one centered column, big readout on top, presets and controls below; sized to sit in a Notion embed block. */
  :root {
    --bg: #ffffff;
    --surface: #f4f4f2;
    --fg: #1f1f1d;
    --muted: #6f6f6a;
    --line: #e3e3df;
    --accent: #2b6cb0;
    --accent-fg: #ffffff;
    --warn: #c2410c;
    --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919; --surface: #252525; --fg: #ececea; --muted: #9a9a94;
      --line: #333331; --accent: #6aa5e6; --accent-fg: #101010; --warn: #f08a5d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #191919; --surface: #252525; --fg: #ececea; --muted: #9a9a94;
    --line: #333331; --accent: #6aa5e6; --accent-fg: #101010; --warn: #f08a5d;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--font-body);
    padding-block: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
  .modes { display: flex; gap: 4px; background: var(--surface); padding: 4px; border-radius: 8px; align-self: center; }
  .modes button { border: 0; background: transparent; color: var(--muted); font: 500 13px var(--font-body); padding: 6px 14px; border-radius: 6px; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--bg); color: var(--fg); box-shadow: 0 1px 2px rgba(0,0,0,.12); }
  .readout { text-align: center; }
  #time {
    font: 700 clamp(56px, 22vw, 96px)/1 var(--font-num); font-variant-numeric: tabular-nums;
    letter-spacing: -0.03em; margin: 0;
  }
  #time.done { color: var(--warn); animation: blink 1s steps(2, start) infinite; }
  #status { margin: 8px 0 0; font-size: 13px; color: var(--muted); min-height: 1.4em; }
  .bar { height: 4px; background: var(--surface); border-radius: 2px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s linear; }
  .presets { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .presets button {
    border: 1px solid var(--line); background: var(--surface); color: var(--fg);
    font: 600 15px var(--font-body); padding: 12px 8px; border-radius: 8px; cursor: pointer;
  }
  .presets button small { display: block; font-weight: 400; font-size: 11px; color: var(--muted); margin-top: 2px; }
  .presets button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .custom { display: flex; gap: 8px; }
  .custom input {
    flex: 1; min-width: 0; font: 500 15px var(--font-body); padding: 11px 12px; border-radius: 8px;
    border: 1px solid var(--line); background: var(--bg); color: var(--fg);
  }
  .custom input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .custom button { font: 600 15px var(--font-body); padding: 11px 18px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: var(--surface); color: var(--fg); }
  .custom.active input { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .controls { display: flex; gap: 8px; }
  .controls button { flex: 1; font: 600 15px var(--font-body); padding: 12px; border-radius: 8px; cursor: pointer; border: 1px solid var(--line); background: transparent; color: var(--fg); }
  .controls #go { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
  button:hover { filter: brightness(0.96); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  [hidden] { display: none !important; }
  @keyframes blink { 50% { opacity: .35; } }
  @media (prefers-reduced-motion: reduce) { #time.done { animation: none; } .bar > i { transition: none; } }
</style>

<main>
  <div class="readout">
    <p id="time" role="timer" aria-live="off">30:00</p>
    <p id="status">Ready</p>
  </div>

  <div class="bar" id="bar"><i id="fill"></i></div>

  <div class="presets" id="presets">
    <button type="button" data-min="30" aria-pressed="true">30 min</button>
    <button type="button" data-min="10" aria-pressed="false">10 min</button>
    <button type="button" data-min="3" aria-pressed="false">3 min</button>
  </div>

  <form class="custom" id="custom" autocomplete="off">
    <input id="custom-min" type="number" inputmode="decimal" min="0.1" max="999" step="any" placeholder="Custom minutes" aria-label="Custom minutes">
    <button type="submit">Set</button>
  </form>

  <div class="controls">
    <button id="go" type="button">Start</button>
    <button id="reset" type="button">Reset</button>
  </div>
</main>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var timeEl = $("time"), statusEl = $("status"), fill = $("fill"), go = $("go");
  var mode = "count", presetMin = 30;
  var total = presetMin * 60000;       // countdown length in ms
  var elapsed = 0;                      // ms accumulated while paused
  var startedAt = null;                 // timestamp when running, else null
  var raf = null, finished = false;

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function fmt(ms, up) {
    var s = up ? Math.floor(ms / 1000) : Math.ceil(ms / 1000);
    var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
    return (h ? h + ":" + pad(m) : m) + ":" + pad(r);
  }
  function used() { return elapsed + (startedAt ? Date.now() - startedAt : 0); }

  function render() {
    var u = used();
    if (mode === "count") {
      var left = Math.max(0, total - u);
      timeEl.textContent = fmt(left, false);
      fill.style.width = (100 * (1 - left / total)) + "%";
      document.title = (startedAt ? fmt(left, false) + " · " : "") + "Notion Timer";
      if (left <= 0 && startedAt && !finished) finish();
    } else {
      timeEl.textContent = fmt(u, true);
      fill.style.width = "0%";
      document.title = (startedAt ? fmt(u, true) + " · " : "") + "Notion Timer";
    }
  }
  function tick() { render(); if (startedAt) raf = setTimeout(tick, 200); }

  function beep() {
    try {
      var C = window.AudioContext || window.webkitAudioContext, ctx = new C();
      [0, 0.35, 0.7].forEach(function (t) {
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
        g.gain.setValueAtTime(0.2, ctx.currentTime + t);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + t + 0.3);
        o.start(ctx.currentTime + t); o.stop(ctx.currentTime + t + 0.3);
      });
    } catch (e) {}
  }
  function finish() {
    finished = true; elapsed = total; startedAt = null; clearTimeout(raf);
    timeEl.textContent = "0:00"; fill.style.width = "100%";
    timeEl.classList.add("done"); statusEl.textContent = "Time is up";
    go.textContent = "Start"; beep();
  }
  function start() {
    if (mode === "count" && used() >= total) reset();
    startedAt = Date.now(); statusEl.textContent = "Running"; go.textContent = "Pause"; tick();
  }
  function pause() {
    elapsed = used(); startedAt = null; clearTimeout(raf);
    statusEl.textContent = "Paused"; go.textContent = "Resume"; render();
  }
  function reset() {
    startedAt = null; elapsed = 0; finished = false; clearTimeout(raf);
    timeEl.classList.remove("done");
    statusEl.textContent = "Ready"; go.textContent = "Start"; render();
  }

  go.addEventListener("click", function () { startedAt ? pause() : start(); });
  $("reset").addEventListener("click", reset);

  $("presets").addEventListener("click", function (e) {
    var b = e.target.closest("button[data-min]"); if (!b) return;
    presetMin = +b.dataset.min; total = presetMin * 60000;
    Array.prototype.forEach.call($("presets").children, function (x) { x.setAttribute("aria-pressed", x === b); });
    $("custom").classList.remove("active"); $("custom-min").value = "";
    reset();
  });

  $("custom").addEventListener("submit", function (e) {
    e.preventDefault();
    var v = parseFloat($("custom-min").value);
    if (!(v >= 0.1 && v <= 999)) { $("custom-min").focus(); return; }
    total = Math.round(v * 60000);
    Array.prototype.forEach.call($("presets").children, function (x) { x.setAttribute("aria-pressed", "false"); });
    $("custom").classList.add("active");
    reset();
  });

  document.addEventListener("keydown", function (e) {
    if (e.code === "Space" && e.target.tagName !== "BUTTON") { e.preventDefault(); go.click(); }
  });
  document.addEventListener("visibilitychange", render);
  render();
})();
</script>
